<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 240" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <!-- Flowing Stream Gradient -->
    <linearGradient id="streamGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.8"/>
    </linearGradient>

    <!-- Node Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 34px;
      fill: #ffffff;
      letter-spacing: -0.5px;
    }
    .subtitle {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 500;
      font-size: 15px;
      fill: #bae6fd;
      letter-spacing: 0.2px;
    }
    .badge-text {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 11px;
      fill: #f0f9ff;
    }
    
    /* Dynamic Animations */
    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 0.9; }
      50% { transform: scale(1.08); opacity: 1; filter: drop-shadow(0 0 10px #38bdf8); }
    }
    @keyframes dash {
      to { stroke-dashoffset: -120; }
    }
    @keyframes floatParticle {
      0% { transform: translateY(0px); opacity: 0.4; }
      50% { transform: translateY(-8px); opacity: 0.9; }
      100% { transform: translateY(0px); opacity: 0.4; }
    }
    
    .animated-stream {
      stroke-dasharray: 12, 12;
      animation: dash 3s linear infinite;
    }
    .floating-dot {
      animation: floatParticle 4s ease-in-out infinite;
    }
    .node-pulse {
      animation: pulse 3s ease-in-out infinite;
      transform-origin: center;
    }
  </style>

  <!-- Background Base -->
  <rect width="880" height="240" rx="16" fill="url(#bgGradient)"/>

  <!-- Geometric Grid Accent Overlay -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="1">
    <path d="M 0,40 L 880,40 M 0,80 L 880,80 M 0,120 L 880,120 M 0,160 L 880,160 M 0,200 L 880,200" />
    <path d="M 80,0 L 80,240 M 160,0 L 160,240 M 240,0 L 240,240 M 320,0 L 320,240 M 400,0 L 400,240 M 480,0 L 480,240 M 560,0 L 560,240 M 640,0 L 640,240 M 720,0 L 720,240 M 800,0 L 800,240" />
  </g>

  <!-- Background CDC Pipeline Stream Animation (Behind Text) -->
  <g opacity="0.4">
    <!-- Stream Line 1 -->
    <path d="M 40,195 Q 220,165 440,195 T 840,195" fill="none" stroke="url(#streamGrad)" stroke-width="3" />
    <path d="M 40,195 Q 220,165 440,195 T 840,195" fill="none" stroke="#38bdf8" stroke-width="3" class="animated-stream" />
    
    <!-- Stream Line 2 -->
    <path d="M 40,210 Q 240,230 480,210 T 840,210" fill="none" stroke="url(#streamGrad)" stroke-width="2" opacity="0.7"/>
    <path d="M 40,210 Q 240,230 480,210 T 840,210" fill="none" stroke="#c084fc" stroke-width="2" class="animated-stream" style="animation-duration: 2s;"/>
  </g>

  <!-- Animated Floating Nodes in Background -->
  <circle cx="120" cy="195" r="5" fill="#38bdf8" class="floating-dot" />
  <circle cx="340" cy="180" r="4" fill="#818cf8" class="floating-dot" style="animation-delay: 1s;" />
  <circle cx="580" cy="205" r="6" fill="#c084fc" class="floating-dot" style="animation-delay: 2s;" />
  <circle cx="760" cy="195" r="4" fill="#38bdf8" class="floating-dot" style="animation-delay: 0.5s;" />

  <!-- Main Content (Foreground - Left Aligned & Clear) -->
  <g transform="translate(48, 48)">
    <!-- Category Pill Badge -->
    <g transform="translate(0, 0)">
      <rect width="210" height="26" rx="13" fill="#0369a1" opacity="0.8"/>
      <rect width="210" height="26" rx="13" fill="none" stroke="#38bdf8" stroke-width="1.2"/>
      <text x="12" y="17" class="badge-text">⚡ REAL-TIME DATA PIPELINES</text>
    </g>

    <!-- Main Title (Foreground) -->
    <text x="0" y="66" class="title">Awesome Change Data Capture</text>
    
    <!-- Subtitle (Foreground) -->
    <text x="0" y="94" class="subtitle">Curated directory of log-based CDC platforms, databases &amp; streaming connectors</text>

    <!-- Feature Tags -->
    <g transform="translate(0, 118)">
      <!-- Tag 1 -->
      <g transform="translate(0, 0)">
        <rect width="110" height="22" rx="6" fill="#1e293b" stroke="#475569"/>
        <text x="10" y="15" class="badge-text">🔄 Log-based CDC</text>
      </g>
      <!-- Tag 2 -->
      <g transform="translate(120, 0)">
        <rect width="135" height="22" rx="6" fill="#1e293b" stroke="#475569"/>
        <text x="10" y="15" class="badge-text">🚀 Real-time Streams</text>
      </g>
      <!-- Tag 3 -->
      <g transform="translate(265, 0)">
        <rect width="115" height="22" rx="6" fill="#1e293b" stroke="#475569"/>
        <text x="10" y="15" class="badge-text">🛠️ Open Source</text>
      </g>
      <!-- Tag 4 -->
      <g transform="translate(390, 0)">
        <rect width="110" height="22" rx="6" fill="#1e293b" stroke="#475569"/>
        <text x="10" y="15" class="badge-text">☁️ Managed SaaS</text>
      </g>
    </g>
  </g>

  <!-- Right Visual Graphics: Node Flow Graphic -->
  <g transform="translate(710, 50)">
    <!-- Source DB Node -->
    <g transform="translate(0, 20)">
      <rect x="-30" y="-18" width="60" height="36" rx="8" fill="#0f172a" stroke="#38bdf8" stroke-width="2" filter="url(#glow)"/>
      <text x="0" y="4" font-family="sans-serif" font-size="12" font-weight="bold" fill="#38bdf8" text-anchor="middle">SOURCE</text>
    </g>
    <!-- Connector Arrow -->
    <path d="M 0,38 L 0,62" stroke="#818cf8" stroke-width="2" stroke-dasharray="4,4" />
    <!-- CDC Event Engine Node -->
    <g transform="translate(0, 80)">
      <circle r="22" fill="#4338ca" stroke="#c084fc" stroke-width="2" filter="url(#glow)"/>
      <text x="0" y="4" font-family="sans-serif" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">CDC</text>
    </g>
    <!-- Connector Arrow -->
    <path d="M 0,102 L 0,126" stroke="#818cf8" stroke-width="2" stroke-dasharray="4,4" />
    <!-- Destination Node -->
    <g transform="translate(0, 144)">
      <rect x="-35" y="-18" width="70" height="36" rx="8" fill="#0f172a" stroke="#34d399" stroke-width="2" filter="url(#glow)"/>
      <text x="0" y="4" font-family="sans-serif" font-size="11" font-weight="bold" fill="#34d399" text-anchor="middle">TARGET</text>
    </g>
  </g>
</svg>
